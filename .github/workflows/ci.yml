name: verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: python -m pytest --cov=backend.app --cov-report=term-missing
      - run: npm test && npm run check
      - run: python -m playwright install --with-deps chromium
      - name: Offline component integration
        run: CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')" python -m scripts.browser_smoke
      - name: HTTP and security-policy integration
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1; done
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')" python -m scripts.http_smoke --base-url http://127.0.0.1:8000
      - name: Docker build and API smoke
        run: |
          docker build -t k7m4q9:test .
          docker run -d --name windward -p 8001:8000 k7m4q9:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/api/health && break || sleep 1; done
          curl -fsS 'http://127.0.0.1:8001/api/snapshot?source=synthetic' | python -c 'import json,sys; d=json.load(sys.stdin); assert len(d["points"]) == 48'
